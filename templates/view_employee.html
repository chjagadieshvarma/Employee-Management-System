<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Employees</title>
</head>
<body>
    <h1>Employee details</h1>

    <form action="/view_employee" method="GET">
        <input type="search" name="search" placeholder="Search Employee Name">
        <button type="submit">Search</button>
        
    </form><br>






    <table border="1" style="border-collapse: collapse;">
        <tr>
            <th>Employee ID</th>
            <th>Name</th>
            <th>Department</th>
            <th>Salary</th>
            <th>Phone Number</th>
            <th colspan="2">Action</th>
        </tr>
        {%for employee in employees%}
        <tr>
            <td>{{employee[0]}}</td>
            <td>{{employee[1]}}</td>
            <td>{{employee[2]}}</td>
            <td>{{employee[3]}}</td>
            <td>{{employee[4]}}</td>
            <td><a href="/edit_employee/{{employee[0]}}">Edit</a></td>
            <td><a href="/delete_employee/{{employee[0]}}">Delete</a></td>
            
        </tr>
        {%endfor%}
    </table>
</body>
</html>
